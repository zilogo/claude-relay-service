worker_processes auto;

events {
  worker_connections 10240;
}

http {
  # 后端服务（本仓库 Node 应用）
  upstream relay_api {
    server api:3000; # 根据部署环境替换为真实主机名/IP
  }

  # Frontpage（独立部署的 Landing Page）
  upstream frontpage_app {
    server frontpage:4173; # 替换为前端容器/服务地址
  }

  server {
    listen 80;
    server_name _;

    # API、管理后台等所有需要交由 Node 处理的请求
    location ~ ^/(api|admin|admin-next|users|payment|hooks|openai|claude|gemini|azure) {
      proxy_pass http://relay_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
    }

    # 健康检查留给 Node 处理，便于监控
    location = /health {
      proxy_pass http://relay_api/health;
      proxy_set_header Host $host;
    }

    # 静态资源直接转发到 frontpage，可设置缓存
    location ~* ^/(assets|img|mp4)/ {
      proxy_pass http://frontpage_app;
      proxy_set_header Host $host;
      expires 7d;
    }

    # 其余（包括根路径、SPA 内部路由）全部交给 frontpage
    location / {
      proxy_pass http://frontpage_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
